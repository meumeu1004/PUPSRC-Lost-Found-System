name: Build Windows EXE

on:
  push:
    branches: [ build-exe ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Run jpackage
        run: |
          jpackage `
            --input target `
            --name LostAndFound `
            --main-jar lostandfoundsystem-1.0-SNAPSHOT.jar `
            --main-class lostandfoundsystem.application.AdminApplication `
            --type exe `
            --app-version 1.0.0 `
            --dest target/dist `
            --win-console

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LostAndFound-Windows
          path: target/dist/*.exe
